
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: flake8 --max-line-length=120 --exclude=venv,.pytest_cache,__pycache__ .

      - name: Run tests
        run: python -m pytest -v

  build:
    name: Build and Smoke Test Docker
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t pet-adoption-portal .

      - name: Start container
        run: docker run -d --name pet-app -p 5000:5000 pet-adoption-portal

      - name: Check application health
        run: |
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:5000/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs pet-app
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f pet-app || true

  deploy:
    name: Deploy to Render
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deployment
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          test -n "$DEPLOY_HOOK"
          curl -fsS -X POST "${DEPLOY_HOOK}&ref=${GITHUB_SHA}"