{% extends "base.html" %}
{% block title %}Add Pet{% endblock %}
{% block content %}
<h1>Add a Pet</h1>
<form class="form" method="post" novalidate>
  <label>Pet Name
    <input type="text" name="name" value="{{ data.name }}" required minlength="2" maxlength="50"></label>
  <div class="row">
    <label>Pet Type
      <select name="type" required>
        <option value="">Select type</option>
        {% for t in pet_types %}<option value="{{ t }}" {{ 'selected' if data.type == t }}>{{ t }}</option>{% endfor %}
      </select></label>
    <label>Gender
      <select name="gender" required>
        <option value="">Select gender</option>
        {% for g in genders %}<option value="{{ g }}" {{ 'selected' if data.gender == g }}>{{ g }}</option>{% endfor %}
      </select></label>
  </div>
  <div class="row">
    <label>Breed
      <input type="text" name="breed" value="{{ data.breed }}" required maxlength="50"></label>
    <label>Age (years)
      <input type="number" name="age" value="{{ data.age }}" required min="0" max="30"></label>
  </div>
  <label>Location
    <input type="text" name="location" value="{{ data.location }}" required maxlength="50"></label>
  <label>Description
    <textarea name="description" rows="4" maxlength="500">{{ data.description }}</textarea></label>
  <label>Image URL (optional)
    <input type="url" name="image_url" value="{{ data.image_url }}" placeholder="https://..."></label>
  <button class="btn" type="submit">Add Pet</button>
</form>
{% endblock %}
