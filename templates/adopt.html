{% extends "base.html" %}
{% block title %}Request Adoption{% endblock %}
{% block content %}
<h1>Request Adoption</h1>
<form class="form" method="post" novalidate>
  <label>Selected Pet
    <input type="text" value="{{ pet.name }} ({{ pet.breed }}, {{ pet.location }})" readonly></label>
  <label>Applicant Name
    <input type="text" name="applicant_name" value="{{ data.applicant_name }}" required maxlength="60"></label>
  <div class="row">
    <label>Email
      <input type="email" name="email" value="{{ data.email }}" required></label>
    <label>Phone
      <input type="tel" name="phone" value="{{ data.phone }}" required pattern="[0-9+\-\s()]{7,15}"></label>
  </div>
  <label>Reason for Adoption
    <textarea name="reason" rows="4" required minlength="10" maxlength="500">{{ data.reason }}</textarea></label>
  <button class="btn" type="submit">Submit Adoption Request</button>
</form>
{% endblock %}
